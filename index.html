<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">

<title>Ordu Savaşı v3</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Ordu%20Sava%C5%9F%C4%B1%20v3%22%2C%22short_name%22%3A%22Ordu%20v3%22%2C%22display%22%3A%22fullscreen%22%2C%22orientation%22%3A%22landscape%22%2C%22background_color%22%3A%22%230d0f0b%22%2C%22theme_color%22%3A%22%23151a10%22%7D">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0f0b;color:#eee;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
#ov{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
#ui{position:fixed;inset:0;pointer-events:none;font-size:14px}
#ui button,#ui input,#ui .screen,#ui .modal,#ui #loading,#ui #rotate,#ui canvas,#ui #joyZone,#ui #lookZone{pointer-events:auto}
.hidden{display:none!important}
button{font:inherit;color:#f3f0e0;background:linear-gradient(#3b4429,#262c1a);border:1px solid #6d7a45;border-radius:10px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96);filter:brightness(1.3)}
button.on{background:linear-gradient(#8a7a2a,#5a4e16);border-color:#e8cf5a}
button.big{font-size:18px;padding:12px 18px;font-weight:700}
button.go{background:linear-gradient(#4f8a2a,#2e5a16);border-color:#9fe060}
button.danger{background:linear-gradient(#8a2a2a,#5a1616);border-color:#e06060}
button:disabled{opacity:.4}
.pill{background:rgba(10,14,8,.72);border:1px solid rgba(160,180,110,.35);border-radius:9px;padding:5px 9px;white-space:nowrap;font-weight:600}
.pill.sm,.sm{font-size:12px;opacity:.9}
.warn{color:#ffcf3f}
.screen{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(40,52,24,.55),rgba(8,10,6,.88));overflow-y:auto;padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 18px max(18px,env(safe-area-inset-left))}
#menu{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;background:linear-gradient(90deg,rgba(8,10,6,.86) 0%,rgba(8,10,6,.55) 45%,rgba(8,10,6,0) 75%)}
.title h1{font-size:clamp(30px,6vw,54px);letter-spacing:3px;color:#f2e6b0;text-shadow:0 3px 0 #3a2e08,0 0 24px rgba(255,200,80,.35);font-weight:900}
.title h1 span{color:#ffb02e;font-size:.6em}
.title p{opacity:.85;margin:2px 0 14px}
.mbtns{display:flex;flex-direction:column;gap:8px;width:min(360px,46vw)}
.mbtns button{text-align:left}
.foot{margin-top:12px;font-size:12px;opacity:.85;max-width:60vw;line-height:1.5}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bar h2{flex:1;color:#f2e6b0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{padding:6px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:96px}
.card b{font-size:18px;color:#ffd76a}.card .nm{font-weight:700}.card .st{color:#ffd23f;letter-spacing:2px}
.card.lock{opacity:.45}.card.boss{border-color:#e8a03a;background:linear-gradient(#4a3a1a,#2a200c)}
.form{display:flex;flex-direction:column;gap:6px;max-width:820px}
.form label{margin-top:8px;font-weight:700;color:#d8d0a0}
.form.txt p{line-height:1.55;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.col{display:flex;flex-direction:column;gap:8px;margin-top:10px}
input{font:inherit;padding:9px;border-radius:8px;border:1px solid #6d7a45;background:#1a1f12;color:#fff;user-select:text;-webkit-user-select:text}
input[type=range]{padding:0;height:30px}
.fcards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fcard{display:flex;flex-direction:column;gap:4px;text-align:left;border-left:5px solid var(--c)}
.fcard span{font-size:12px;opacity:.85}
.tech{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.3);padding:6px 10px;border-radius:8px}
.tech span:first-child{flex:1}.tech .lv{color:#ffd23f;letter-spacing:2px}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20}
.mbox{background:linear-gradient(#2a3120,#171b11);border:1px solid #8a9a55;border-radius:14px;padding:16px 20px;max-width:min(620px,94vw);max-height:92vh;overflow-y:auto;box-shadow:0 10px 40px #000}
.mbox h2{color:#f2e6b0;margin-bottom:6px}.mbox h2.win{color:#ffd23f;font-size:30px}.mbox h2.lose{color:#ff6a5a;font-size:30px}
.mbox p{margin:4px 0}.mbox p.big{font-size:17px}
.stars{font-size:38px;color:#ffd23f;letter-spacing:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:8px;font-size:14px}
.kv span{opacity:.75}
#loading{position:absolute;inset:0;background:radial-gradient(#1c2214,#070806);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:30}
#loading h2{color:#f2e6b0}
.lbar{width:min(480px,70vw);height:12px;border-radius:6px;background:#222;border:1px solid #556;overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6a8a2a,#ffd23f);transition:width .3s}
#rotate{position:absolute;inset:0;background:#0d0f0b;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:20px}
#rotate div{font-size:64px}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#top{position:absolute;top:max(6px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;gap:6px;align-items:center;pointer-events:none}
#top .sp{flex:1}
#top .obj{max-width:38vw;overflow:hidden;text-overflow:ellipsis}
.ib{padding:6px 10px;font-size:16px;min-width:42px}
#prod{position:absolute;right:max(6px,env(safe-area-inset-right));top:50px;bottom:8px;width:96px;display:flex;flex-direction:column;gap:5px;overflow-y:auto;pointer-events:auto;scrollbar-width:none}
.pb{position:relative;display:flex;flex-direction:column;align-items:center;padding:4px 2px;gap:0;overflow:hidden;flex-shrink:0}
.pb::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:var(--p,0%);background:#ffd23f}
.pb .ic{font-size:20px;line-height:1.1}.pb .nm{font-size:11px;font-weight:700}.pb .c{font-size:11px;color:#ffe08a}
.pb .q{position:absolute;top:2px;right:5px;font-size:12px;font-weight:800;color:#9f9}
.pb.poor{opacity:.5}.pb.tool{background:linear-gradient(#2c3a44,#1a232a);border-color:#5a7a8a}
#mini{position:absolute;left:max(8px,env(safe-area-inset-left));bottom:8px;width:min(150px,22vh);height:min(150px,22vh);border:2px solid #8a9a55;border-radius:8px;background:#000}
#selbar{position:absolute;left:calc(max(8px,env(safe-area-inset-left)) + min(150px,22vh) + 8px);right:112px;bottom:8px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;pointer-events:none}
#selbar button{padding:7px 9px;font-size:13px}
#bDirect.pulse{animation:pulse 1.2s infinite;background:linear-gradient(#8a5a1a,#5a3a0c);border-color:#ffb02e}
@keyframes pulse{50%{box-shadow:0 0 14px #ffb02e}}
#toasts{position:absolute;top:52px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:40}
.toast{background:rgba(12,16,8,.85);border:1px solid #8a9a55;border-radius:9px;padding:6px 14px;font-weight:600;transition:opacity .5s,transform .5s}
.toast.out{opacity:0;transform:translateY(-8px)}
#direct{position:absolute;inset:0}
#joyZone{position:absolute;left:0;top:50px;bottom:0;width:42%}
#lookZone{position:absolute;right:0;top:50px;bottom:0;width:58%}
#joy{position:absolute;left:40px;bottom:40px;top:auto;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.25);pointer-events:none}
#joy.act{bottom:auto}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.45)}
#cross{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:none}
#cross i,#cross b{position:absolute;background:#fff;box-shadow:0 0 3px #000}
#cross i{left:16px;top:0;width:2px;height:34px}#cross b{top:16px;left:0;height:2px;width:34px}
#cross.lock i,#cross.lock b{background:#ff4a3a}
#cross.hit{transform:scale(1.4) rotate(45deg)}
#bExit{position:absolute;left:max(10px,env(safe-area-inset-left));top:52px}
#dcInfo{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:5px 12px;border-radius:8px;font-weight:600;pointer-events:none;white-space:nowrap}
#bFire{position:absolute;right:max(24px,env(safe-area-inset-right));bottom:28px;width:104px;height:104px;border-radius:50%;font-size:17px;font-weight:900;background:radial-gradient(#c0401a,#6a1a08);border-color:#ff8a5a}
#bAlt{position:absolute;right:max(140px,calc(env(safe-area-inset-right) + 120px));bottom:40px;width:70px;height:70px;border-radius:50%;font-size:28px}
@media (max-height:420px){.mbtns button{padding:7px 12px}.mbtns button.big{font-size:16px}.title h1{font-size:30px}.title p{margin-bottom:6px}}
</style>
</head>

<p><b>Kamera:</b> Tek parmak s\xFCr\xFCkle = kayd\u0131r. \u0130ki parmak s\u0131k\u0131\u015Ft\u0131r = yak\u0131nla\u015F/uzakla\u015F. \u0130ki parma\u011F\u0131 d\xF6nd\xFCr = \xE7evir. \u0130ki parmakla yukar\u0131/a\u015Fa\u011F\u0131 = e\u011Fim.</p>
<p><b>Se\xE7im:</b> Birli\u011Fe dokun = se\xE7. Ayn\u0131 birli\u011Fe iki kez dokun = ekrandaki ayn\u0131 t\xFCr\xFC se\xE7. \u2B1A Kutu = alan se\xE7imi. \u2694\uFE0F T\xFCm\xFC = t\xFCm ordu.</p>
<p><b>Emir:</b> Bo\u015F yere dokun = git. D\xFC\u015Fmana dokun = sald\u0131r. \u{1F3AF} Sald\u0131r\u0131 A\xC7IK iken dokundu\u011Fun yere giderken yoldaki d\xFC\u015Fmanla sava\u015F\u0131r. Uzun bas = sald\u0131rarak ilerle.</p>
<p><b>\xDCretim:</b> Sa\u011F panelden birlik \xFCret (karargahtan \xE7\u0131kar). \u{1F5FC} Kule: karargah ya da bayra\u011F\u0131n\u0131n yan\u0131na savunma kulesi. \u{1F6A9} Toplanma: yeni birliklerin bulu\u015Fma noktas\u0131.</p>
<p><b>Bayraklar:</b> Bayra\u011F\u0131n halkas\u0131na birlik sok \u2192 ele ge\xE7ir \u2192 gelir artar.</p>
<p><b>\u{1F3AE} Kontrol Et (hibrit mod):</b> Tek birlik se\xE7ip bas. Sol taraf = hareket kolu, sa\u011F taraf = ni\u015Fan al, \u{1F525} = ate\u015F, \u{1F4A3} = \xF6zel (el bombas\u0131 / sis+onar\u0131m / roket salvosu). Do\u011Frudan kontrolde hasar +%50.</p>
<p><b>Fraksiyonlar:</b> \u{1F6E1}\uFE0F Demir Pen\xE7e (z\u0131rh), \u{1F32A}\uFE0F R\xFCzgar Klan\u0131 (h\u0131z), \u{1F333} K\xF6k Toprak (ekonomi).</p>
<p><b>Kay\u0131t:</b> Otomatik (30 sn) + \u{1F4BE}. IndexedDB'ye yaz\u0131l\u0131r. Ana men\xFC \u2192 Devam Et.</p>
<p><b>Serbest oyun:</b> Ayarlar \u2192 Serbest oyun A\xC7: s\u0131n\u0131rs\u0131z kaynak, t\xFCm g\xF6rev ve birlikler a\xE7\u0131k, h\u0131zl\u0131 \xFCretim.</p>
<p><b>Klavye (bilgisayar):</b> WASD kayd\u0131r, Q/E \xE7evir, tekerlek zoom. Kontrol modunda WASD + fare, Bo\u015Fluk ate\u015F, G \xF6zel.</p>
